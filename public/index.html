<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #1f2937;
            background: radial-gradient(circle at top, #097fe8 0%, #0a4fa3 100%);
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 8px;
            font-size: 2.6rem;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.75);
            margin-bottom: 35px;
        }

        #Container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
            gap: 12px;
            max-width: 780px;
            margin: 0 auto;
            padding: 28px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 18px;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        .toast {
            background: black;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button class="logout-btn" onclick="logout()">Logout</button>

    <h1>1 Million CheckBoxes</h1>
    <p class="subtitle">Real-time collaborative grid</p>

    <div id="Container"></div>
    <div id="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>

        // 🔐 AUTH GUARD
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "/login.html";
        }

        const container = document.getElementById("Container");
        const toastContainer = document.getElementById("toast-container");

        let socket;

        // 🔌 SOCKET INIT
        async function initSocket() {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "/login.html";
                return;
            }

            socket = io({
                auth: { token }
            });

            setupSocketEvents();
        }

        // 🔁 SOCKET EVENTS
        function setupSocketEvents() {

            socket.on("connect", () => {
                console.log("Connected:", socket.id);
            });

            socket.on("connect_error", (err) => {
                console.log("Socket error:", err.message);

                if (err.message === "Unauthorized") {
                    localStorage.removeItem("token");
                    alert("Session expired. Login again.");
                    window.location.href = "/login.html";
                }
            });

            socket.on("server:error", (data) => {
                showErrorToast(data?.error || "Something went wrong");
            });

            socket.on("server:checkbox:change", (data) => {
                const { index, checked } = data;
                const input = document.getElementById(`checkbox-${index}`);
                if (input) {
                    input.checked = checked;
                }
            });
        }

        // 🔔 TOAST
        function showErrorToast(message) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // 📦 FETCH STATE (kept intentionally)
        async function fetchStateFromServer() {
            container.innerHTML = "";

            const res = await fetch("/checkboxes");
            const data = await res.json();

            data.checkboxes.forEach((value, index) => {
                const input = document.createElement("input");
                input.type = "checkbox";
                input.id = `checkbox-${index}`;
                input.checked = value;

                input.addEventListener("change", (e) => {
                    const checked = e.target.checked;

                    if (socket && socket.connected) {
                        socket.emit("client:checkbox:change", { index, checked });
                    }

                    // keeping your logic
                    fetchStateFromServer();
                });

                container.appendChild(input);
            });
        }

        // 🚪 LOGOUT
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login.html";
        }

        // 🚀 INIT
        window.addEventListener("load", async () => {
            await initSocket();
            fetchStateFromServer();
        });

    </script>
</body>
</html>
